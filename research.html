<style>
:root{ --ink:#14231D; --paper:#F4F6F0; --muted:#5C6B63; --faint:#8A978D; --line:#E2E7DD; --teal-deep:#0B7568; }
@media (prefers-color-scheme:dark){ :root{ --ink:#F2F5EE; --paper:#0F1512; --muted:#97A69B; --faint:#6A786E; --line:#26302A; --teal-deep:#4FD0BD; } }
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Inter",-apple-system,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
.rwrap{min-height:calc(100vh - 58px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px 80px;gap:0}
.r-eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--teal-deep)}
.rwrap h1{font-family:"Fraunces",Georgia,serif;font-size:clamp(34px,6vw,52px);font-weight:600;line-height:1.06;letter-spacing:-.02em;margin:14px 0 0;max-width:16ch;text-wrap:balance}
.rwrap p{font-size:16.5px;color:var(--muted);line-height:1.6;max-width:52ch;margin:18px 0 0}
.chip{margin-top:30px;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);border:1px dashed var(--line);border-radius:99px;padding:8px 16px}
.r-mark{opacity:.5;margin-bottom:6px}

/* ---- shared top nav ---- */
:root{ --nav-bg:rgba(244,246,240,.82); --nav-line:#e2e7dd; --nav-ink:#14231d; --nav-muted:#5c6b63; }
@media (prefers-color-scheme:dark){ :root{ --nav-bg:rgba(15,21,18,.82); --nav-line:#26302a; --nav-ink:#f2f5ee; --nav-muted:#97a69b; } }
.topnav{ position:sticky; top:0; z-index:100; display:flex; align-items:center; gap:20px; height:58px; padding:0 22px; background:var(--nav-bg); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--nav-line); }
.nb-brand{ display:flex; align-items:center; gap:9px; text-decoration:none; flex:none; }
.nb-brand b{ font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:16px; letter-spacing:-.01em; color:var(--nav-ink); }
.nb-tabs{ display:flex; align-items:stretch; height:100%; margin-left:4px; overflow-x:auto; scrollbar-width:none; }
.nb-tabs::-webkit-scrollbar{ display:none; }
.nb-tab{ position:relative; display:flex; align-items:center; height:100%; padding:0 14px; white-space:nowrap; text-decoration:none; font-family:"Inter",-apple-system,sans-serif; font-size:14px; font-weight:500; color:var(--nav-muted); transition:color .15s ease; }
.nb-tab:hover{ color:var(--nav-ink); }
.nb-tab.is-active{ color:var(--nav-ink); font-weight:600; }
.nb-tab.is-active::after{ content:""; position:absolute; left:12px; right:12px; bottom:0; height:2px; border-radius:2px 2px 0 0; background:#6C5CE7; }
.nb-tab:focus-visible{ outline:2px solid #6C5CE7; outline-offset:-4px; border-radius:8px; }
@media (max-width:560px){ .nb-brand b{ display:none; } .nb-tab{ padding:0 11px; font-size:13.5px; } }
</style>
