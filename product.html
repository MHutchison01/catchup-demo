<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{ --paper:#F4F6F0; --card:#FFFFFF; --ink:#14231D; --muted:#5C6B63; --line:#E2E7DD; --violet:#6C5CE7; --teal-deep:#0B7568; }
@media (prefers-color-scheme:dark){ :root{ --paper:#0F1512; --card:#18201B; --ink:#F2F5EE; --muted:#97A69B; --line:#26302A; --violet:#7D6EF0; --teal-deep:#4FD0BD; } }
body{ font-family:"Inter",-apple-system,sans-serif; background:var(--paper); color:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; -webkit-font-smoothing:antialiased; }
body::before{ content:""; position:fixed; inset:-20vh -20vw; z-index:-1; pointer-events:none; filter:blur(70px); opacity:.55;
  background:
    radial-gradient(36% 30% at 14% 16%, rgba(18,165,148,.18), transparent 70%),
    radial-gradient(30% 26% at 86% 12%, rgba(108,92,231,.14), transparent 70%),
    radial-gradient(28% 28% at 76% 86%, rgba(255,107,74,.11), transparent 70%);
  animation:lkDrift 22s ease-in-out infinite alternate; }
@keyframes lkDrift{ from{ transform:translate3d(-1.5%,-1%,0); } to{ transform:translate3d(1.5%,1.5%,0) scale(1.05); } }
.lock{ width:min(400px,100%); background:var(--card); border:1px solid var(--line); border-radius:22px; padding:38px 34px 30px; text-align:center; box-shadow:0 30px 70px -30px rgba(20,35,29,.35);
  animation:lkIn .7s cubic-bezier(.2,.65,.25,1) both .1s; }
@keyframes lkIn{ from{ opacity:0; transform:translateY(20px) scale(.97); } to{ opacity:1; transform:none; } }
.lock svg{ width:64px; height:auto; }
.lock svg circle{ stroke-dasharray:660; stroke-dashoffset:660; animation:lkDraw 1.15s cubic-bezier(.45,0,.2,1) forwards .3s; }
.lock svg circle:first-of-type{ animation-delay:.5s; }
.lock svg path{ opacity:0; animation:lkFade .5s ease forwards 1.35s; }
@keyframes lkDraw{ to{ stroke-dashoffset:0; } }
@keyframes lkFade{ to{ opacity:1; } }
@media (prefers-reduced-motion:reduce){
  body::before{ animation:none; }
  .lock{ animation:none; }
  .lock svg circle{ animation:none; stroke-dasharray:none; stroke-dashoffset:0; }
  .lock svg path{ animation:none; opacity:1; }
}
.lk-eyebrow{ font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-weight:600; letter-spacing:.17em; text-transform:uppercase; color:var(--teal-deep); margin-top:18px; }
h1{ font-family:"Fraunces",Georgia,serif; font-size:26px; font-weight:600; letter-spacing:-.01em; margin-top:8px; }
.lk-sub{ font-size:13.5px; color:var(--muted); line-height:1.55; margin-top:8px; }
form{ margin-top:22px; display:flex; flex-direction:column; gap:11px; }
input{ height:50px; border:1.5px solid var(--line); border-radius:13px; background:transparent; color:var(--ink); text-align:center; font-family:"IBM Plex Mono",monospace; font-size:17px; letter-spacing:.35em; outline:none; transition:border-color .15s; }
input:focus{ border-color:var(--violet); }
button{ height:50px; border:0; border-radius:999px; background:var(--violet); color:#fff; font-family:"Inter",sans-serif; font-size:15px; font-weight:600; cursor:pointer; }
button:active{ opacity:.85; }
button[disabled]{ opacity:.6; cursor:wait; }
.lk-err{ font-size:12.5px; color:#D14343; margin-top:10px; min-height:16px; opacity:0; transition:opacity .15s; }
.lk-err.on{ opacity:1; }
.lock.shake{ animation:lkShake .4s; }
@keyframes lkShake{ 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }
.lk-foot{ font-size:11px; color:var(--muted); opacity:.75; margin-top:20px; line-height:1.5; }
</style>

  var b64=function(s){ var b=atob(s), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i); return a; };
  function unlock(pin, silent){
    pin=(pin||'').trim().toLowerCase();
    if(!pin) return Promise.resolve(false);
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey'])
      .then(function(km){ return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.salt), iterations:250000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']); })

        document.open(); document.write(html); document.close();
        return true;

      .catch(function(){
        if(!silent){
          var el=document.getElementById('err'); el.classList.add('on');
          var lk=document.getElementById('lk'); lk.classList.remove('shake'); void lk.offsetWidth; lk.classList.add('shake');

      });

  var saved=null; try{ saved=sessionStorage.getItem('cu.gate'); }catch(e){}

  document.getElementById('f').addEventListener('submit', function(e){
    e.preventDefault();
    var b=document.getElementById('go'); b.disabled=true; b.textContent='Unlocking…';
